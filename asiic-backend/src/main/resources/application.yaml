# Configuración Aplicación
app:
  frontend:
    domain: ${FRONT_DOMAIN:http://localhost:4200}
  security:
    jwt:
      secret: ${JWT_TEMP_SECRET}
      expiration:
        reset-password: 900000  # 15 mins
        verity-email: 86400000  # 24 horas

# Configuración OID
keycloak:
  client: ${KC_CLIENT}
  realm: ${KC_REALM}
  server: ${KC_SERVER}
  principalClaimName: preferred_name
  ssl:
    disable-trust-manager: ${KC_DISABLE_TRUST_MANAGER:false}
  clients:
    auth:
      id: asiic-auth-client
      secret: ${KC_AUTH_SECRET}
    admin:
      id: asiic-admin-client
      secret: ${KC_ADMIN_SECRET}

spring:
  application:
    name: asiic-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.server}/realms/${keycloak.realm}
          jwk-set-uri: ${keycloak.server}/realms/${keycloak.realm}/protocol/openid-connect/certs

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3       # Tamaño fijo óptimo para 4 núcleos
      connection-timeout: 3000    # 3 segundos (falla rápido si se agotan)
      max-lifetime: 1200000       # 20 minutos (asegurarse de que la BD tenga wait_timeout > 25m)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  # Configuración para servidor de correo electrónico
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    from: ${MAIL_FROM}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Configuración Liquibase Migraciones
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true

# Configuración Tomcat Server
server:
  port: 8888

# Configuración Swagger Open API
openapi:
  service:
    title: ASIIC Backend
    version: @project.version@
    description: Documentación API Web Service

# Configuración para servidor SFTP de archivos
sftp:
  host: ${SFTP_HOST}
  port: ${SFTP_PORT:22}
  user: ${SFTP_USER}
  password: ${SFTP_PASSWORD:}
  remote-directory: ${SFTP_REMOTE_DIRECTORY:/archivos/asiic}
  private-key-path: "file:${user.home}/.ssh/sftp_key"
  private-key-passphrase: ${SFTP_PRIVATE_KEY_PASSPHRASE:}
  allow-unknown-keys: ${SFTP_ALLOW_UNKNOWN_KEYS:true}
  session-cache-size: ${SFTP_SESSION_CACHE_SIZE:10}
  session-wait-timeout: ${SFTP_SESSION_WAIT_TIMEOUT:5000}