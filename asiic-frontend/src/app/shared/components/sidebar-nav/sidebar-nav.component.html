<clr-vertical-nav
  [clrVerticalNavCollapsible]="!isMobile"
  [clrVerticalNavCollapsed]="!isMobile && collapsed"
  (clrVerticalNavCollapsedChange)="onCollapseChange($event)"
  class="portal-sidebar-nav"
>
  <!-- Enlace directo Inicio según rol -->
  <a
    clrVerticalNavLink
    [routerLink]="dashboardLink()"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    title="Dashboard Principal"
    (click)="onLinkClick()"
  >
    <cds-icon shape="home" clrVerticalNavIcon></cds-icon>
    Dashboard Principal
  </a>

  <!-- MENÚ ANALISTA DE SOLICITUDES -->
  <ng-container *ngIf="isAnalista()">
    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true">
      <cds-icon shape="tasks" clrVerticalNavIcon></cds-icon>
      Gestión de Solicitudes
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/analista/incidencias-asignadas" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="clipboard" clrVerticalNavIcon></cds-icon>
          Incidencias Asignadas
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>
  </ng-container>

  <!-- MENÚ AGENTE DE CAMPO -->
  <ng-container *ngIf="isAgente()">
    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true">
      <cds-icon shape="map-marker" clrVerticalNavIcon></cds-icon>
      Operaciones de Campo
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/agente/dashboard" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="dashboard" clrVerticalNavIcon></cds-icon>
          Panel de Campo
        </a>
        <a clrVerticalNavLink routerLink="/analista/incidencias-asignadas" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="tasks" clrVerticalNavIcon></cds-icon>
          Inspecciones Asignadas
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>
  </ng-container>

  <!-- MENÚ ADMINISTRADOR (Municipalidades y Usuarios) -->
  <ng-container *ngIf="isAdmin()">
    <!-- Grupo Acceso Directo Incidencias Asignadas para Admin si aplica -->
    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="false">
      <cds-icon shape="tasks" clrVerticalNavIcon></cds-icon>
      Incidencias
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/analista/incidencias-asignadas" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="clipboard" clrVerticalNavIcon></cds-icon>
          Incidencias Asignadas
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>

    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true">
      <cds-icon shape="building" clrVerticalNavIcon></cds-icon>
      Municipalidades
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/admin/registro-municipalidad" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="plus-circle" clrVerticalNavIcon></cds-icon>
          Registrar Municipalidad
        </a>
        <a clrVerticalNavLink href="javascript:void(0)" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="list" clrVerticalNavIcon></cds-icon>
          Directorio
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>

    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="false">
      <cds-icon shape="users" clrVerticalNavIcon></cds-icon>
      Usuarios
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/admin/registro-usuario" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="user-plus" clrVerticalNavIcon></cds-icon>
          Crear Usuario
        </a>
        <a clrVerticalNavLink href="javascript:void(0)" routerLinkActive="active" (click)="onLinkClick()">
          <cds-icon shape="users" clrVerticalNavIcon></cds-icon>
          Listado de Usuarios
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>
  </ng-container>


</clr-vertical-nav>
