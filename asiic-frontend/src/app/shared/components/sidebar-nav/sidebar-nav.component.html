<clr-vertical-nav
  [clrVerticalNavCollapsible]="true"
  [clrVerticalNavCollapsed]="collapsed"
  (clrVerticalNavCollapsedChange)="onCollapseChange($event)"
  class="portal-sidebar-nav"
>
  <!-- Enlace directo Inicio -->
  <a
    clrVerticalNavLink
    [routerLink]="isAdmin() ? '/admin/dashboard' : '/vecino/dashboard'"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    title="Dashboard Principal"
  >
    <cds-icon shape="home" clrVerticalNavIcon></cds-icon>
    Dashboard Principal
  </a>

  <!-- MENÚ ADMINISTRADOR -->
  <ng-container *ngIf="isAdmin()">
    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true">
      <cds-icon shape="building" clrVerticalNavIcon></cds-icon>
      Municipalidades
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/admin/registro-municipalidad" routerLinkActive="active">
          <cds-icon shape="plus-circle" clrVerticalNavIcon></cds-icon>
          Registrar Municipalidad
        </a>
        <a clrVerticalNavLink href="javascript:void(0)" routerLinkActive="active">
          <cds-icon shape="list" clrVerticalNavIcon></cds-icon>
          Directorio
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>

    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="false">
      <cds-icon shape="users" clrVerticalNavIcon></cds-icon>
      Usuarios
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/admin/registro-usuario" routerLinkActive="active">
          <cds-icon shape="user-plus" clrVerticalNavIcon></cds-icon>
          Crear Usuario
        </a>
        <a clrVerticalNavLink href="javascript:void(0)" routerLinkActive="active">
          <cds-icon shape="users" clrVerticalNavIcon></cds-icon>
          Listado de Usuarios
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>
  </ng-container>

  <!-- MENÚ VECINO -->
  <ng-container *ngIf="!isAdmin()">
    <!-- Grupo Gestiones Ciudadanas -->
    <clr-vertical-nav-group [clrVerticalNavGroupExpanded]="true">
      <cds-icon shape="folder" clrVerticalNavIcon></cds-icon>
      Gestiones Vecinales
      <clr-vertical-nav-group-children>
        <a clrVerticalNavLink routerLink="/vecino/solicitudes" routerLinkActive="active">
          <cds-icon shape="file" clrVerticalNavIcon></cds-icon>
          Mis Solicitudes
        </a>
        <a clrVerticalNavLink routerLink="/vecino/quejas" routerLinkActive="active">
          <cds-icon shape="exclamation-circle" clrVerticalNavIcon></cds-icon>
          Quejas y Reclamos
        </a>
        <a clrVerticalNavLink routerLink="/vecino/denuncias" routerLinkActive="active">
          <cds-icon shape="shield" clrVerticalNavIcon></cds-icon>
          Denuncias Ciudadanas
        </a>
        <a clrVerticalNavLink routerLink="/vecino/sugerencias" routerLinkActive="active">
          <cds-icon shape="talk-bubbles" clrVerticalNavIcon></cds-icon>
          Buzón de Sugerencias
        </a>
      </clr-vertical-nav-group-children>
    </clr-vertical-nav-group>


  </ng-container>
</clr-vertical-nav>
