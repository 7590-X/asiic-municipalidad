<div [formGroup]="stepForm" class="rv-grid">
  <clr-input-container>
    <label>NIT</label>
    <input clrInput formControlName="nit" maxlength="13" autocomplete="off" />
    <clr-control-helper>Opcional</clr-control-helper>
    <clr-control-error *clrIfError="'pattern'">Solo dígitos, o terminado en una letra (máx. 13)</clr-control-error>
  </clr-input-container>

  <clr-input-container>
    <label>Pasaporte</label>
    <input clrInput formControlName="pasaporte" />
    <clr-control-helper>Opcional (vecino extranjero)</clr-control-helper>
    <clr-control-error *clrIfError="'pattern'">Solo números y letras</clr-control-error>
    <clr-control-error *clrIfError="'maxlength'; error as err">Máximo {{ err.requiredLength }}
      caracteres</clr-control-error>
  </clr-input-container>
</div>
