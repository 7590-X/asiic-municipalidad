<div *ngIf="stepForm" [formGroup]="stepForm" class="rv-grid">
  <clr-input-container class="rv-full">
    <label class="clr-required-mark">CUI</label>
    <input clrInput formControlName="cui" appOnlyDigits inputmode="numeric" maxlength="13" autocomplete="off" />
    <clr-control-error *clrIfError="'required'">El CUI es obligatorio</clr-control-error>
    <clr-control-error *clrIfError="'pattern'">Debe tener exactamente 13 dígitos</clr-control-error>
    <clr-control-error *clrIfError="'invalidCui'; error as err">{{ err }}</clr-control-error>
  </clr-input-container>

  <clr-input-container>
    <label class="clr-required-mark">Nombres</label>
    <input clrInput formControlName="nombres" appCapitalizeWords maxlength="45" />
    <clr-control-error *clrIfError="'required'">Los nombres son obligatorios</clr-control-error>
  </clr-input-container>

  <clr-input-container>
    <label class="clr-required-mark">Apellidos</label>
    <input clrInput formControlName="apellidos" appCapitalizeWords maxlength="45" />
    <clr-control-error *clrIfError="'required'">Los apellidos son obligatorios</clr-control-error>
  </clr-input-container>

  <clr-select-container>
    <label class="clr-required-mark">Género</label>
    <select clrSelect formControlName="genero" s>
      <option value="">Seleccione…</option>
      @for (g of generos; track $index) {
      <option [value]='g.id'>{{g.value}}</option>
      }
    </select>
    <clr-control-error *clrIfError="'required'">Seleccione el género</clr-control-error>
  </clr-select-container>

  <clr-select-container>
    <label class="clr-required-mark">Estado civil</label>
    <select clrSelect formControlName="estado_civil_id">
      <option value="">Seleccione…</option>
      <option *ngFor="let c of estadoCivil()" [value]="c.id">{{ c.valor }}</option>
    </select>
    <clr-control-error *clrIfError="'required'">Seleccione el estado civil</clr-control-error>
  </clr-select-container>

  <clr-select-container>
    <label class="clr-required-mark">Profesión</label>
    <select clrSelect formControlName="profesion_id">
      <option value="">Seleccione…</option>
      <option *ngFor="let p of profesiones()" [value]="p.id">{{ p.valor }}</option>
    </select>
    <clr-control-error *clrIfError="'required'">Seleccione la profesión</clr-control-error>
  </clr-select-container>
</div>
<button clrStepButton="next" class="btn btn-primary">Siguiente</button>
